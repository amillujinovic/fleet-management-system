name: Deploy
on:
  push:
    branches: [main]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PAT}}
      - name: Build backend
        run: | 
          docker build -t ${{secrets.DOCKERHUB_USERNAME}}/backend-image:latest ./dotnet-backend/projekatFlutter 
          docker push ${{secrets.DOCKERHUB_USERNAME}}/backend-image:latest 
      - name: Build ML
        run: |
          docker build -t ${{secrets.DOCKERHUB_USERNAME}}/ml-image:latest ./ML
          docker push ${{secrets.DOCKERHUB_USERNAME}}/ml-image:latest
      - name: Build Frontend
        run: | 
          docker build -t ${{secrets.DOCKERHUB_USERNAME}}/frontend-image:latest ./frontend 
          docker push ${{secrets.DOCKERHUB_USERNAME}}/frontend-image:latest

