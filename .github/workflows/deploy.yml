name: Deploy
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-image:latest ./dotnet-backend/projekatFlutter
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-image:latest

      - name: Build ML
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ml-image:latest ./ML
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ml-image:latest

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: [build-and-push]        
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1    
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > ~/docker-compose.yml << 'EOF'
            services:
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/backend-image:latest
                ports:
                  - "8080:8080"
                environment:
                  - PythonServiceUrl=http://ml:8000
                  - ASPNETCORE_URLS=http://+:8080
                  - ConnectionStrings__DefaultConnection=Host=db;Database=TransportDb;Username=postgres;Password=Fleet123!
                restart: unless-stopped
                depends_on:
                  - ml
                  - db
              ml:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/ml-image:latest
                ports:
                  - "8000:8000"
              db:
                image: postgres:15-alpine
                environment:
                  - POSTGRES_DB=TransportDb
                  - POSTGRES_USER=postgres
                  - POSTGRES_PASSWORD=Fleet123!
                ports:
                  - "5432:5432"
                volumes:
                  - pgdata:/var/lib/postgresql/data
            volumes:
              pgdata:
            EOF
            cd ~
            sudo docker compose pull
            sudo docker compose up -d --force-recreate
            sudo docker image prune -f
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build-and-push]       
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable

      - name: Build Flutter
        working-directory: ./frontend
        run: flutter build web --release --dart-define=API_URL=http://${{ secrets.EC2_HOST }}:8080/api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}     
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  
          aws-region: eu-central-1

      - name: Upload to S3
        run: |
          aws s3 sync ./frontend/build/web s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # - name: Invalidate CloudFront cache
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
      #       --paths "/*"
