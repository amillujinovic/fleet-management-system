name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
      - name: Restore dependencies
        working-directory: ./dotnet-backend/projekatFlutter
        run: dotnet restore
      - name: Build dotnet
        working-directory: ./dotnet-backend/projekatFlutter
        run: dotnet build --no-restore --configuration Release
      - name: Test
        working-directory: ./dotnet-backend/projekatFlutter
        run: dotnet test --no-build --configuration Release
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v4
      - name: Install dependencies
        working-directory: ./ML
        run: pip install -r requirements.txt
      - name: Check syntax
        working-directory: ./ML
        run: python -m py_compile main.py
  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get 
      - name: Build frontend
        working-directory: ./frontend
        run: flutter build web --release
  docker:
    runs-on: ubuntu-latest
    needs: [dotnet,python,flutter]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build dotnet
        run: docker build -t fleet-backend ./dotnet-backend/projekatFlutter
      - name: Build python
        run: docker build -t fleet-python ./ML
      - name: Build frontend
        run: docker build -t fleet-frontend ./frontend

