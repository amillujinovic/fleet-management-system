apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: fleet
  name: fleet-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080

