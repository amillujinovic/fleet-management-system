services:
  ml:
    build: 
      context: ./ML
    ports:
        - "8000:8000"
  backend:
    build: 
      context: ./dotnet-backend/projekatFlutter
    ports: 
        - "8080:8080"
    environment:
      PythonServiceUrl: "http://ml:8000"
  frontend:
    build: 
      context: ./frontend
    ports:
        - "80:80"