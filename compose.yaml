services:
  ml:
    build:
      context: ./ML
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./dotnet-backend/projekatFlutter
    ports:
      - "8080:8080"
    environment:
      PythonServiceUrl: "http://ml:8000"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TransportDb;User Id=sa;Password=${SQL_PASS};TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASS}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data: